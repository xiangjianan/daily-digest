<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hermes 定时任务·每日简报</title>
<meta name="description" content="定时任务每日输出聚合">
<meta name="theme-color" content="#0f1115" id="themeColor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --surface2: #f0f2f5;
    --text: #17181c; --dim: #7c828e; --line: rgba(0,0,0,.07);
    --accent: #3b6ef6; --ok: #17a563; --fail: #e5484d;
    --shadow: 0 1px 3px rgba(20,24,34,.06), 0 4px 14px rgba(20,24,34,.05);
  }
  html.dark {
    --bg: #0e1014; --surface: #171a21; --surface2: #1f232d;
    --text: #e8ebf1; --dim: #8b93a3; --line: rgba(255,255,255,.07);
    --accent: #5b8cff; --ok: #3ecf8e; --fail: #ff6369;
    --shadow: 0 1px 3px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    max-width: 600px; margin: 0 auto; min-height: 100dvh;
    padding: 0 16px calc(46px + env(safe-area-inset-bottom));
    transition: background .25s, color .25s;
  }
  .bar {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    margin: 0 -16px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    border-bottom: 1px solid var(--line);
  }
  .bar-row { display: flex; align-items: center; gap: 8px; }
  .bar h1 {
    font-size: 16px; font-weight: 700; letter-spacing: .2px;
    flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .iconbtn {
    width: 34px; height: 34px; border-radius: 50%;
    border: none; background: var(--surface); color: var(--text);
    font-size: 15px; cursor: pointer; flex: none;
    box-shadow: var(--shadow); display: grid; place-items: center;
    transition: transform .12s;
  }
  .iconbtn:active { transform: scale(.92); }
  .todaybtn {
    height: 34px; padding: 0 13px; border-radius: 17px; border: none;
    background: var(--accent); color: #fff; font-size: 13px; font-weight: 600;
    cursor: pointer; flex: none; box-shadow: var(--shadow); transition: transform .12s;
  }
  .todaybtn:active { transform: scale(.94); }
  .datenav { display: flex; align-items: center; gap: 8px; padding: 12px 2px 2px; }
  .datenav .step {
    width: 34px; height: 34px; border-radius: 50%; border: none;
    background: var(--surface); color: var(--text); font-size: 16px;
    cursor: pointer; box-shadow: var(--shadow); flex: none;
  }
  .datenav input {
    flex: 1; height: 34px; border: none; border-radius: 10px;
    background: var(--surface); color: var(--text);
    padding: 0 12px; font-size: 14px; font-weight: 500;
    box-shadow: var(--shadow); color-scheme: light dark; text-align: center;
  }
  .summary {
    color: var(--dim); font-size: 12.5px; margin: 14px 4px 12px;
    display: flex; align-items: center; gap: 6px;
  }
  .summary .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
  .summary .dot.fail { background: var(--fail); }
  .card {
    background: var(--surface); border-radius: 18px; padding: 16px 18px;
    margin-bottom: 12px; box-shadow: var(--shadow);
  }
  .card .head { display: flex; align-items: center; gap: 9px; }
  .card .emoji {
    width: 34px; height: 34px; border-radius: 11px; background: var(--surface2);
    display: grid; place-items: center; font-size: 16px; flex: none;
  }
  .card .name { font-weight: 650; font-size: 15.5px; flex: 1; min-width: 0; }
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 600; flex: none; }
  .badge.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
  .badge.fail { color: var(--fail); background: color-mix(in srgb, var(--fail) 13%, transparent); }
  .meta { color: var(--dim); font-size: 12px; margin: 8px 2px 0; }
  .preview {
    color: var(--dim); font-size: 13.5px; margin-top: 8px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .full {
    display: none; margin-top: 12px; padding-top: 12px;
    border-top: 1px solid var(--line);
    font-size: 14.5px; white-space: pre-wrap; word-break: break-word;
  }
  .full a, .preview a { color: var(--accent); text-decoration: none; }
  .full a { word-break: break-all; }
  .card.open .preview { display: none; }
  .card.open .full { display: block; }
  .toggle {
    margin-top: 10px; color: var(--accent); font-size: 13px; font-weight: 600;
    background: none; border: none; cursor: pointer; padding: 2px 0;
  }
  .empty { text-align: center; color: var(--dim); padding: 70px 0; font-size: 14px; }
  .loading { text-align: center; color: var(--dim); padding: 70px 0; font-size: 14px; }
  footer { text-align: center; color: var(--dim); font-size: 11.5px; margin-top: 28px; opacity: .8; }
</style>
</head>
<body>
<div class="bar">
  <div class="bar-row">
    <h1>Hermes 定时任务·每日简报</h1>
    <button class="todaybtn" id="todayBtn">今天</button>
    <button class="iconbtn" id="themeBtn" title="切换主题">🌙</button>
  </div>
  <div class="datenav">
    <button class="step" id="prev" title="前一天">‹</button>
    <input type="date" id="datepick">
    <button class="step" id="next" title="后一天">›</button>
  </div>
</div>
<div class="summary" id="summary"></div>
<div id="content"><div class="loading">加载中…</div></div>
<footer id="footer"></footer>

<script>
/* ---------- 主题 ---------- */
const themeBtn = document.getElementById('themeBtn');
const themeColor = document.getElementById('themeColor');
function applyTheme(t) {
  document.documentElement.classList.toggle('dark', t === 'dark');
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  themeColor.content = t === 'dark' ? '#0e1014' : '#f5f6f8';
}
(function initTheme() {
  const saved = localStorage.getItem('theme');
  const sysDark = matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved || (sysDark ? 'dark' : 'light'));
})();
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
  localStorage.setItem('theme', next);
  applyTheme(next);
});

/* ---------- 工具 ---------- */
function fmtLocal(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function shiftDate(dateStr, delta) {
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + delta);
  return fmtLocal(dt);
}
function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function weekdayCN(dateStr) {
  return '日一二三四五六'[new Date(dateStr + 'T12:00:00').getDay()];
}

/* ---------- 轻量 markdown（链接 → 新标签页 <a>） ---------- */
function mdLite(raw) {
  const links = [];
  let h = esc(raw);
  // [text](url)
  h = h.replace(/\[([^\]]*)\]\((https?:\/\/[^)\s]+)(?:\s+"[^"]*")?\)/g, (m, t, u) => {
    links.push('<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + (t || u) + '</a>');
    return '\u0000' + (links.length - 1) + '\u0000';
  });
  // 剩余裸链接（避开已替换的占位符，且不吃尾部标点）
  h = h.replace(/https?:\/\/[^\s<>"']*[^\s<>"'，。；：！？、）("'\]\[\u0000]/g, (u) => {
    links.push('<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + u + '</a>');
    return '\u0000' + (links.length - 1) + '\u0000';
  });
  // 粗体 / 标题行
  h = h.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
       .replace(/(^|\n)#{1,3}\s*([^\n]+)/g, (m, p, t) => p + '<b>' + t + '</b>');
  return h.replace(/\u0000(\d+)\u0000/g, (m, i) => links[+i]);
}

/* ---------- 数据 ---------- */
let manifest = null;
const dayCache = {};
const dateSet = new Set();

async function loadDay(dateStr) {
  if (dayCache[dateStr] !== undefined) return dayCache[dateStr];
  try {
    const r = await fetch('data/' + dateStr + '.json');
    dayCache[dateStr] = r.status === 404 ? null : await r.json();
  } catch (e) { dayCache[dateStr] = null; }
  return dayCache[dateStr];
}

function render(dateStr, day) {
  const c = document.getElementById('content');
  document.getElementById('datepick').value = dateStr;
  if (!day) {
    document.getElementById('summary').textContent = '';
    c.innerHTML = '<div class="empty">这一天没有任务记录</div>';
    return;
  }
  const okCount = day.jobs.filter(j => j.status === 'ok').length;
  const allOk = okCount === day.jobs.length;
  document.getElementById('summary').innerHTML =
    '<span class="dot' + (allOk ? '' : ' fail') + '"></span>' +
    day.date + ' 周' + weekdayCN(day.date) + ' · ' + okCount + '/' + day.jobs.length + ' 成功';
  c.innerHTML = day.jobs.map(function(j, i) {
    const badge = j.status === 'ok'
      ? '<span class="badge ok">✓ 成功</span>'
      : '<span class="badge fail">✕ 失败</span>';
    const full = j.full ? (
      '<div class="full">' + mdLite(j.full) + '</div>' +
      '<button class="toggle" data-i="' + i + '">展开全文</button>'
    ) : '';
    const dur = j.duration_min ? ' · 用时 ' + j.duration_min + ' 分钟' : '';
    return '<div class="card" id="card' + i + '">' +
      '<div class="head"><span class="emoji">' + esc(j.emoji) + '</span>' +
      '<span class="name">' + esc(j.name) + '</span>' + badge + '</div>' +
      '<div class="meta">' + j.time + ' 发布' + dur + '</div>' +
      '<div class="preview">' + mdLite(j.preview || '') + '</div>' +
      full + '</div>';
  }).join('');
  c.querySelectorAll('.toggle').forEach(function(btn) {
    btn.addEventListener('click', function() {
      const card = document.getElementById('card' + btn.dataset.i);
      card.classList.toggle('open');
      btn.textContent = card.classList.contains('open') ? '收起' : '展开全文';
    });
  });
}

async function show(dateStr) {
  document.getElementById('content').innerHTML = '<div class="loading">加载中…</div>';
  render(dateStr, await loadDay(dateStr));
}

async function init() {
  manifest = await (await fetch('data/manifest.json')).json();
  manifest.days.forEach(d => dateSet.add(d.date));
  const today = fmtLocal(new Date());
  const latest = dateSet.size ? [...dateSet].sort().pop() : today;
  show(dateSet.has(today) ? today : latest);
  document.getElementById('footer').textContent =
    '最新：' + (manifest.days[0] ? manifest.days[0].date : '-') + ' · 共 ' + dateSet.size + ' 天';
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}

document.getElementById('prev').addEventListener('click', () =>
  show(shiftDate(document.getElementById('datepick').value || fmtLocal(new Date()), -1)));
document.getElementById('next').addEventListener('click', () =>
  show(shiftDate(document.getElementById('datepick').value || fmtLocal(new Date()), 1)));
document.getElementById('datepick').addEventListener('change', e => show(e.target.value));
document.getElementById('todayBtn').addEventListener('click', () => {
  const today = fmtLocal(new Date());
  show(dateSet.has(today) ? today : (dateSet.size ? [...dateSet].sort().pop() : today));
});

init();
</script>
</body>
</html>
