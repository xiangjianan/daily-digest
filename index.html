<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每日简报</title>
<meta name="description" content="定时任务每日输出聚合">
<meta name="theme-color" content="#ffffff" id="themeColor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #ffffff;
    --text: #18181b;
    --text-2: #3f3f46;
    --dim: #8a8a93;
    --faint: #b6b6bd;
    --line: #ececef;
    --hover: #fafafa;
    --accent: #2563eb;
    --ok: #16a34a;
    --fail: #dc2626;
    --skeleton-a: #f2f2f4;
    --skeleton-b: #e7e7ea;
  }
  html.dark {
    --bg: #0c0c0e;
    --text: #ededf0;
    --text-2: #c6c6cd;
    --dim: #85858e;
    --faint: #55555e;
    --line: #212126;
    --hover: #141417;
    --accent: #8ab0ff;
    --ok: #4ade80;
    --fail: #f87171;
    --skeleton-a: #161619;
    --skeleton-b: #1f1f24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.75 -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    min-height: 100dvh;
    transition: background .25s ease, color .25s ease;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 24px calc(56px + env(safe-area-inset-bottom)); }

  /* ---------- 顶栏 ---------- */
  .bar {
    position: sticky; top: 0; z-index: 30;
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    transition: background .25s ease;
  }
  .bar-in {
    max-width: 640px; margin: 0 auto;
    padding: calc(12px + env(safe-area-inset-top)) 24px 12px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }
  .brand { font-size: 13px; font-weight: 650; letter-spacing: .18em; color: var(--text); user-select: none; }
  .brand i { font-style: normal; color: var(--faint); margin-left: 10px; letter-spacing: .02em; font-weight: 500; font-size: 12px; }
  .bar-btns { display: flex; align-items: center; gap: 4px; }
  .ghost { width: 34px; height: 34px; border-radius: 50%;
    border: none; background: transparent; color: var(--dim);
    display: grid; place-items: center; cursor: pointer;
    transition: background .15s, color .15s, transform .12s;
  }
  .ghost:active { transform: scale(.9); }
  .ghost svg { width: 18px; height: 18px; }

  /* ---------- Hero 日期 ---------- */
  .hero { padding: 34px 2px 10px; }
  .hero-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .hero-date {
    font-size: 30px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.25;
    display: flex; align-items: baseline; gap: 10px; cursor: pointer; position: relative;
  }
  .hero-date .week { font-size: 15px; font-weight: 500; color: var(--dim); letter-spacing: 0; }
  .hero-date input {
    position: absolute; inset: 0; opacity: 0; cursor: pointer;
    width: 100%; height: 100%;
  }
  .hero-sub {
    margin-top: 7px; font-size: 12.5px; color: var(--dim); letter-spacing: .01em;
    display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
  }
  .hero-sub .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: none; }
  .hero-sub .dot.fail { background: var(--fail); }
  .hero-sub .latest-link {
    color: var(--accent); cursor: pointer; background: none; border: none;
    font-size: 12.5px; padding: 0; font-family: inherit; letter-spacing: .01em;
  }
  .hero-nav { display: flex; align-items: center; gap: 2px; padding-bottom: 4px; }
  .hero-nav .ghost { width: 32px; height: 32px; }
  .hero-nav .ghost svg { width: 17px; height: 17px; }

  /* ---------- 时间轴列表 ---------- */
  .feed { padding-top: 10px; }
  .entry {
    padding: 24px 2px;
    border-bottom: 1px solid var(--line);
    animation: fadeUp .35s ease both;
  }
  .entry:last-child { border-bottom: none; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .e-meta {
    font-size: 12.5px; color: var(--faint);
    font-variant-numeric: tabular-nums; letter-spacing: .02em;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .e-meta .ft { color: var(--fail); font-weight: 600; letter-spacing: .04em; }
  .e-head { margin-top: 4px; }
  .e-name { font-size: 16.5px; font-weight: 650; letter-spacing: -0.01em; }
  .e-name .emoji { font-size: 15px; margin-right: 7px; }
  .e-text {
    margin-top: 8px; font-size: 15px; line-height: 1.8; color: var(--text-2);
    word-break: break-word;
  }
  .e-text.clamp {
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .e-text a { color: var(--accent); text-decoration: none; }
  .e-text b { color: var(--text); font-weight: 650; }
  .e-more {
    margin-top: 6px; display: inline-flex; align-items: center; gap: 3px;
    background: none; border: none; cursor: pointer; padding: 2px 0;
    color: var(--dim); font-size: 13px; font-weight: 500; font-family: inherit;
    transition: color .15s;
  }
  .e-more svg { width: 14px; height: 14px; transition: transform .25s ease; }
  .entry.open .e-more svg { transform: rotate(180deg); }
  .entry.open .e-text.clamp { display: block; }

  /* hover 反馈仅用于有真实指针的设备（避免移动端 sticky hover 残留） */
  @media (hover: hover) and (pointer: fine) {
    .ghost:hover { background: var(--hover); color: var(--text); }
    .hero-date:hover .week { color: var(--text-2); }
    .hero-sub .latest-link:hover { text-decoration: underline; text-underline-offset: 3px; }
    .e-text a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .e-more:hover { background: var(--hover); }
  }

  /* ---------- 骨架屏 ---------- */
  .sk { padding: 24px 2px; border-bottom: 1px solid var(--line); }
  .sk-l { height: 13px; border-radius: 5px; margin-bottom: 12px; }
  .sk-l.w22 { width: 22%; margin-bottom: 14px; }
  .sk-l.w38 { width: 38%; }
  .sk-l.w55 { width: 55%; margin-bottom: 0; }
  .sk-l.w70 { width: 70%; }
  .sk-l.w85 { width: 85%; }
  .sk-l {
    background: linear-gradient(90deg, var(--skeleton-a) 25%, var(--skeleton-b) 45%, var(--skeleton-a) 65%);
    background-size: 240% 100%;
    animation: shimmer 1.4s ease-in-out infinite;
  }
  @keyframes shimmer { from { background-position: 130% 0; } to { background-position: -110% 0; } }

  /* ---------- 空状态 / 页脚 ---------- */
  .empty { text-align: center; padding: 84px 0 60px; color: var(--faint); }
  .empty svg { width: 34px; height: 34px; opacity: .55; }
  .empty p { margin-top: 14px; font-size: 13.5px; letter-spacing: .02em; }
  footer {
    margin-top: 40px; text-align: center;
    color: var(--faint); font-size: 11.5px; letter-spacing: .04em;
  }
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <div class="brand">每日简报<i>DAILY&nbsp;DIGEST</i></div>
    <div class="bar-btns">
      <button class="ghost" id="themeBtn" aria-label="切换主题">
        <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="wrap">

  <section class="hero">
    <div class="hero-row">
      <div>
        <div class="hero-date" id="heroDate">
          <span id="heroMain">—</span><span class="week" id="heroWeek"></span>
          <input type="date" id="datepick" aria-label="选择日期">
        </div>
        <div class="hero-sub" id="heroSub"></div>
      </div>
      <div class="hero-nav">
        <button class="ghost" id="prev" aria-label="前一天">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button class="ghost" id="next" aria-label="后一天">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
  </section>

  <section class="feed" id="content"></section>

  <footer id="footer"></footer>
</div>

<script>
/* ---------- 主题 ---------- */
const themeBtn = document.getElementById('themeBtn');
const themeColor = document.getElementById('themeColor');
const iconMoon = document.getElementById('iconMoon');
const iconSun = document.getElementById('iconSun');
function applyTheme(t) {
  document.documentElement.classList.toggle('dark', t === 'dark');
  iconMoon.style.display = t === 'dark' ? 'none' : '';
  iconSun.style.display = t === 'dark' ? '' : 'none';
  themeColor.content = t === 'dark' ? '#0c0c0e' : '#ffffff';
}
(function initTheme() {
  const saved = localStorage.getItem('theme');
  const sysDark = matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved || (sysDark ? 'dark' : 'light'));
})();
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
  localStorage.setItem('theme', next);
  applyTheme(next);
});

/* ---------- 工具 ---------- */
function fmtLocal(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function shiftDate(dateStr, delta) {
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + delta);
  return fmtLocal(dt);
}
function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function weekdayCN(dateStr) {
  return '日一二三四五六'[new Date(dateStr + 'T12:00:00').getDay()];
}

/* ---------- 轻量 markdown（链接 → 新标签页 <a>） ---------- */
function mdLite(raw) {
  const links = [];
  let h = esc(raw);
  // [text](url)
  h = h.replace(/\[([^\]]*)\]\((https?:\/\/[^)\s]+)(?:\s+"[^"]*")?\)/g, (m, t, u) => {
    links.push('<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + (t || u) + '</a>');
    return '\u0000' + (links.length - 1) + '\u0000';
  });
  // 剩余裸链接（避开已替换的占位符，且不吃尾部标点）
  h = h.replace(/https?:\/\/[^\s<>"']*[^\s<>"'，。；：！？、）("'()\[\]\u0000]/g, (u) => {
    links.push('<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + u + '</a>');
    return '\u0000' + (links.length - 1) + '\u0000';
  });
  // 粗体 / 标题行
  h = h.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
       .replace(/(^|\n)#{1,3}\s*([^\n]+)/g, (m, p, t) => p + '<b>' + t + '</b>');
  return h.replace(/\u0000(\d+)\u0000/g, (m, i) => links[+i]);
}

/* ---------- 数据 ---------- */
let manifest = null;
const dayCache = {};   // 仅作断网兜底：正常时每次切日期都从云端拉最新
const dateSet = new Set();

async function loadDay(dateStr) {
  try {
    const r = await fetch('data/' + dateStr + '.json?t=' + Date.now(), { cache: 'no-store' });
    const day = r.status === 404 ? null : await r.json();
    dayCache[dateStr] = day;
    return day;
  } catch (e) {
    return dayCache[dateStr] !== undefined ? dayCache[dateStr] : null;
  }
}

const CHEVRON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';

function skeleton() {
  let s = '';
  for (let i = 0; i < 3; i++) {
    s += '<div class="sk">' +
      '<div class="sk-l w22"></div><div class="sk-l w38"></div><div class="sk-l w85"></div><div class="sk-l w70"></div><div class="sk-l w55"></div>' +
      '</div>';
  }
  return s;
}

function render(dateStr, day) {
  document.getElementById('datepick').value = dateStr;
  const [y, m, d] = dateStr.split('-').map(Number);
  document.getElementById('heroMain').textContent = m + '月' + d + '日';
  document.getElementById('heroWeek').textContent = '星期' + weekdayCN(dateStr);
  const sub = document.getElementById('heroSub');

  if (!day) {
    const latest = dateSet.size ? [...dateSet].sort().pop() : null;
    const isLatest = !latest || dateStr === latest;
    sub.innerHTML = '<span>' + y + '</span>' +
      (isLatest ? '' : '<button class="latest-link" id="latestLink">回到最新 →</button>');
    const lb = document.getElementById('latestLink');
    if (lb) lb.addEventListener('click', () => show([...dateSet].sort().pop()));
    document.getElementById('content').innerHTML =
      '<div class="empty">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>' +
      '<p>这一天没有任务记录</p></div>';
    return;
  }

  const okCount = day.jobs.filter(j => j.status === 'ok').length;
  const allOk = okCount === day.jobs.length;
  const latest = dateSet.size ? [...dateSet].sort().pop() : null;
  const isLatest = !latest || dateStr === latest;

  sub.innerHTML =
    '<span class="dot' + (allOk ? '' : ' fail') + '"></span>' +
    '<span>' + y + ' · ' + (allOk
      ? '全部 ' + day.jobs.length + ' 项任务完成'
      : okCount + '/' + day.jobs.length + ' 项任务完成') + '</span>' +
    (isLatest ? '' : '<button class="latest-link" id="latestLink">回到最新 →</button>');

  const latestBtn = document.getElementById('latestLink');
  if (latestBtn) latestBtn.addEventListener('click', () => show([...dateSet].sort().pop()));

  document.getElementById('content').innerHTML = day.jobs.map(function(j, i) {
    const metaParts = [];
    if (j.time) metaParts.push(esc(j.time));
    if (j.duration_min) metaParts.push('用时 ' + j.duration_min + ' 分钟');
    if (j.status !== 'ok') metaParts.push('<span class="ft">任务失败</span>');
    const full = j.full ? (
      '<div class="e-text full-text" style="display:none">' + mdLite(j.full) + '</div>' +
      '<button class="e-more" data-i="' + i + '">展开全文 ' + CHEVRON + '</button>'
    ) : '';
    return '<article class="entry" id="entry' + i + '" style="animation-delay:' + (i * 60) + 'ms">' +
      '<div class="e-meta">' + metaParts.join(' · ') + '</div>' +
      '<div class="e-head"><span class="e-name"><span class="emoji">' + esc(j.emoji || '') + '</span>' + esc(j.name) + '</span></div>' +
      '<div class="e-text clamp">' + mdLite(j.preview || '') + '</div>' +
      full + '</article>';
  }).join('');

  document.querySelectorAll('.e-more').forEach(function(btn) {
    btn.addEventListener('click', function() {
      const entry = document.getElementById('entry' + btn.dataset.i);
      const preview = entry.querySelector('.e-text.clamp');
      const fullText = entry.querySelector('.full-text');
      const open = fullText.style.display !== 'none';
      fullText.style.display = open ? 'none' : 'block';
      preview.style.display = open ? '' : 'none';
      btn.firstChild.textContent = open ? '展开全文 ' : '收起 ';
    });
  });
}

async function show(dateStr) {
  // 兜底：日期控件的"还原/清除"会传空值，非法日期一律回退到数据最新一天
  if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr || '')) {
    dateStr = dateSet.size ? [...dateSet].sort().pop() : fmtLocal(new Date());
  }
  document.getElementById('content').innerHTML = skeleton();
  render(dateStr, await loadDay(dateStr));
}

async function init() {
  manifest = await (await fetch('data/manifest.json?t=' + Date.now(), { cache: 'no-store' })).json();
  manifest.days.forEach(d => dateSet.add(d.date));
  const today = fmtLocal(new Date());
  const latest = dateSet.size ? [...dateSet].sort().pop() : today;
  show(dateSet.has(today) ? today : latest);
  document.getElementById('footer').textContent =
    '已收录 ' + dateSet.size + ' 天 · 每日由定时任务自动生成';
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}

document.getElementById('prev').addEventListener('click', () =>
  show(shiftDate(document.getElementById('datepick').value || fmtLocal(new Date()), -1)));
document.getElementById('next').addEventListener('click', () =>
  show(shiftDate(document.getElementById('datepick').value || fmtLocal(new Date()), 1)));
document.getElementById('datepick').addEventListener('change', e => show(e.target.value));
document.getElementById('heroDate').addEventListener('click', () => {
  // 点击日期区域任意位置都稳定唤起原生选择器（showPicker 需用户手势，旧浏览器自动回退 input 原生行为）
  const dp = document.getElementById('datepick');
  try { if (dp.showPicker) dp.showPicker(); } catch (e) { /* picker 已打开时忽略 */ }
});

init();
</script>
</body>
</html>
