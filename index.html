<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每日简报</title>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --card2: #1d212b;
    --text: #e6e9ef; --dim: #8b93a3; --line: #262b36;
    --accent: #4f8cff; --ok: #34c77b; --fail: #ff5c5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.65 -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif;
    max-width: 560px; margin: 0 auto; padding: 0 16px calc(40px + env(safe-area-inset-bottom));
  }
  header { padding: 22px 0 10px; }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: .5px; }
  header .sub { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .datenav {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--line); margin-bottom: 14px;
  }
  .datenav button {
    background: var(--card); border: 1px solid var(--line); color: var(--text);
    width: 38px; height: 34px; border-radius: 9px; font-size: 15px; cursor: pointer;
  }
  .datenav button:active { background: var(--card2); }
  .datenav input {
    flex: 1; background: var(--card); border: 1px solid var(--line);
    color: var(--text); height: 34px; border-radius: 9px; padding: 0 10px;
    font-size: 14px; color-scheme: dark;
  }
  .summary { color: var(--dim); font-size: 12px; margin: 0 2px 12px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px 16px; margin-bottom: 12px;
  }
  .card .head { display: flex; align-items: center; gap: 8px; }
  .card .emoji { font-size: 17px; }
  .card .name { font-weight: 600; font-size: 15px; flex: 1; }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500;
  }
  .badge.ok { color: var(--ok); background: rgba(52,199,123,.12); }
  .badge.fail { color: var(--fail); background: rgba(255,92,92,.12); }
  .meta { color: var(--dim); font-size: 12px; margin-top: 3px; }
  .preview {
    color: var(--dim); font-size: 13px; margin-top: 8px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .full {
    display: none; margin-top: 10px; padding-top: 10px;
    border-top: 1px solid var(--line);
    font-size: 14px; white-space: pre-wrap; word-break: break-word;
  }
  .full a { color: var(--accent); word-break: break-all; }
  .card.open .preview { display: none; }
  .card.open .full { display: block; }
  .toggle {
    margin-top: 10px; color: var(--accent); font-size: 13px;
    background: none; border: none; cursor: pointer; padding: 0; font-weight: 500;
  }
  .empty { text-align: center; color: var(--dim); padding: 60px 0; font-size: 14px; }
  .loading { text-align: center; color: var(--dim); padding: 60px 0; }
  footer { text-align: center; color: var(--dim); font-size: 11px; margin-top: 26px; }
</style>
</head>
<body>
<header>
  <h1>每日简报</h1>
  <div class="sub">定时任务 · 自动生成</div>
</header>
<div class="datenav">
  <button id="prev" title="前一天">‹</button>
  <input type="date" id="datepick">
  <button id="next" title="后一天">›</button>
</div>
<div class="summary" id="summary"></div>
<div id="content"><div class="loading">加载中…</div></div>
<footer id="footer"></footer>

<script>
const MANIFEST_URL = 'data/manifest.json';
let manifest = null;
const dayCache = {};
const dateSet = new Set();

function fmtLocal(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function shiftDate(dateStr, delta) {
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + delta);
  return fmtLocal(dt);
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function mdLite(s) {
  let h = esc(s);
  // [text](url)
  h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // **bold**
  h = h.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  // 剩余裸链接
  h = h.replace(/(^|[\s（(「])((?:https?:\/\/)[^\s<>"')\]]+)/g,
    '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return h;
}

function weekdayCN(dateStr) {
  return '日一二三四五六'[new Date(dateStr + 'T12:00:00').getDay()];
}

async function loadDay(dateStr) {
  if (dayCache[dateStr]) return dayCache[dateStr];
  const r = await fetch('data/' + dateStr + '.json');
  if (r.status === 404) { dayCache[dateStr] = null; return null; }
  const j = await r.json();
  dayCache[dateStr] = j;
  return j;
}

function render(dateStr, day) {
  const c = document.getElementById('content');
  document.getElementById('datepick').value = dateStr;
  if (!day) {
    document.getElementById('summary').textContent = '';
    c.innerHTML = '<div class="empty">这一天没有任务记录</div>';
    return;
  }
  const okCount = day.jobs.filter(j => j.status === 'ok').length;
  document.getElementById('summary').textContent =
    day.date + ' 周' + weekdayCN(day.date) + ' · ' + okCount + '/' + day.jobs.length + ' 成功';
  c.innerHTML = day.jobs.map(function(j, i) {
    const badge = j.status === 'ok'
      ? '<span class="badge ok">✓ 成功</span>'
      : '<span class="badge fail">✕ 失败</span>';
    const full = j.full ? (
      '<div class="full">' + mdLite(j.full) + '</div>' +
      '<button class="toggle" data-i="' + i + '">展开全文</button>'
    ) : '';
    const dur = j.duration_min ? ' · 用时 ' + j.duration_min + ' 分钟' : '';
    return '<div class="card" id="card' + i + '">' +
      '<div class="head"><span class="emoji">' + esc(j.emoji) + '</span>' +
      '<span class="name">' + esc(j.name) + '</span>' + badge + '</div>' +
      '<div class="meta">' + j.time + ' 发布' + dur + '</div>' +
      '<div class="preview">' + mdLite(j.preview || '') + '</div>' +
      full + '</div>';
  }).join('');
  c.querySelectorAll('.toggle').forEach(function(btn) {
    btn.addEventListener('click', function() {
      const card = document.getElementById('card' + btn.dataset.i);
      card.classList.toggle('open');
      btn.textContent = card.classList.contains('open') ? '收起' : '展开全文';
    });
  });
}

async function show(dateStr) {
  document.getElementById('content').innerHTML = '<div class="loading">加载中…</div>';
  const day = await loadDay(dateStr);
  render(dateStr, day);
}

async function init() {
  manifest = await (await fetch(MANIFEST_URL)).json();
  manifest.days.forEach(function(d) { dateSet.add(d.date); });
  const latest = dateSet.size ? [...dateSet].sort().pop() : fmtLocal(new Date());
  const today = fmtLocal(new Date());
  show(dateSet.has(today) ? today : latest);
  document.getElementById('footer').textContent =
    '最新：' + (manifest.days[0] ? manifest.days[0].date : '-') + ' · 共 ' + dateSet.size + ' 天';
}

document.getElementById('prev').addEventListener('click', function() {
  show(shiftDate(document.getElementById('datepick').value || fmtLocal(new Date()), -1));
});
document.getElementById('next').addEventListener('click', function() {
  show(shiftDate(document.getElementById('datepick').value || fmtLocal(new Date()), 1));
});
document.getElementById('datepick').addEventListener('change', function(e) {
  show(e.target.value);
});

init();
</script>
</body>
</html>
